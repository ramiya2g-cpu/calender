    function playDingDongSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        
        osc1.start();
        osc1.stop(audioCtx.currentTime + 0.3);

        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(600, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.4);
        }, 150);
      } catch (e) {
        console.log("오디오 재생 실패:", e);
      }
    }

    function getCalculatedShift(dateObj, group) {
      const d1 = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const d2 = new Date(REF_DATE.getFullYear(), REF_DATE.getMonth(), REF_DATE.getDate());
      const diffDays = Math.round((d1 - d2) / (1000 * 60 * 60 * 24));

      const offset = GROUP_OFFSETS[group];
      let cycleIdx = (REF_A_CYCLE_INDEX + diffDays + offset) % 20;
      if (cycleIdx < 0) cycleIdx += 20;

      return CYCLE_PATTERN[cycleIdx];
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById('currentMonthLabel').textContent = `${year}년 ${month + 1}월`;

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDayOfWeek = firstDay.getDay();
      const totalDays = lastDay.getDate();

      let workCount = 0;
      let nightCount = 0;
      const statsDisplay = document.getElementById('monthStatsDisplay');

      if (selectedFilterGroup !== 'ALL' && selectedFilterGroup !== 'LEAVE') {
        for (let d = 1; d <= totalDays; d++) {
          const dObj = new Date(year, month, d);
          const dStr = formatDateStr(year, month, d);
          const dData = sharedDatabase[dStr] || { memberStatuses: {}, shifts: {}, memos: {}, generalMemo: '' };
          const base = getCalculatedShift(dObj, selectedFilterGroup);

          const custom = dData.shifts && dData.shifts[selectedFilterGroup] ? dData.shifts[selectedFilterGroup] : 'NONE';
          const isOffDay = (custom === '휴무') || (base === '휴무' && custom === 'NONE');

          if (!isOffDay) {
            workCount++;
            if (base === '야간') {
              nightCount++;
            }
          }
        }

        const dayShiftCount = workCount - nightCount;

        statsDisplay.innerHTML = `
          <span class="text-blue-600 dark:text-blue-400">${selectedFilterGroup}반</span> 
          <span>근무일수 <strong class="text-slate-900 dark:text-white">${workCount}일 (${workCount * 8}시간)</strong></span>

          <span>주간일수 <strong class="text-slate-900 dark:text-white">${dayShiftCount}일 (${dayShiftCount * 8}시간)</strong></span>
          <span class="text-slate-300 dark:text-slate-600">·</span>

        statsDisplay.style.display = 'flex';

        let leaveDaysCount = 0;

            if (!hasCustomOrMemo) return; // 휴가자 모드일 때는 변경사항/초록색 항목이 없으면 표시하지 않음
          } else if (selectedFilterGroup !== 'ALL') {
            if (selectedFilterGroup !== grp) return;
          }

          let displayLabel = `${grp}반 ${baseShift}`;
          if (memberStrs.length > 0) {
            displayLabel += ` / ${memberStrs.join(', ')}`;
          }
          if (customStatus !== 'NONE') {
            displayLabel += ` (${customStatus})`;
          }
          if (memoText && memoText.trim() !== '') {
            displayLabel += ` [${memoText.trim()}]`;
          }

          let shiftStyle = '';
          if (hasCustomOrMemo) {
            shiftStyle = 'border sm:border-2 border-emerald-500 bg-emerald-100 dark:bg-emerald-950/80 text-emerald-950 dark:text-emerald-200 font-black shadow-xs';
          } else {
            if (baseShift === '휴무') {
              shiftStyle = 'border border-pink-200 dark:border-pink-900/50 bg-pink-50 dark:bg-pink-950/40 text-pink-700 dark:text-pink-300 font-extrabold';
            } else if (baseShift === '오전') {
              shiftStyle = 'border border-blue-200 dark:border-blue-900/50 bg-blue-100 dark:bg-blue-950/50 text-blue-900 dark:text-blue-200 font-extrabold';
            } else if (baseShift === '오후') {
              shiftStyle = 'border border-amber-200 dark:border-amber-900/50 bg-amber-100 dark:bg-amber-950/50 text-amber-900 dark:text-amber-200 font-extrabold';
            } else if (baseShift === '야간') {
              shiftStyle = 'border border-indigo-200 dark:border-indigo-900/50 bg-indigo-100 dark:bg-indigo-950/50 text-indigo-900 dark:text-indigo-200 font-extrabold';
            }
          }

          cellHTML += `
            <div class="flex items-center justify-center px-1 sm:px-2 py-0.5 sm:py-1.5 rounded-md sm:rounded-lg text-[10px] sm:text-xs font-bold ${shiftStyle} transition-all text-center leading-tight keep-all overflow-hidden">
              <span class="tracking-tighter sm:tracking-tight whitespace-normal break-keep">${displayLabel}</span>
            </div>
          `;
        });

        cellHTML += `</div>`;
        cell.innerHTML = cellHTML;
        grid.appendChild(cell);
      }

      const totalRenderedCells = startDayOfWeek + totalDays;
      const remainingCells = (7 - (totalRenderedCells % 7)) % 7;
      for (let i = 1; i <= remainingCells; i++) {
        const cell = document.createElement('div');
        cell.className = 'bg-slate-50/60 dark:bg-slate-950/40 p-1 sm:p-2 min-h-[90px] sm:min-h-[140px] opacity-30 select-none border-b border-slate-200 dark:border-slate-800';
        cell.innerHTML = `<span class="text-xs sm:text-sm font-semibold text-slate-400">${i}</span>`;
        grid.appendChild(cell);
      }
    }

    function openModal(dateStr, dateObj) {
      activeModalDateStr = dateStr;
      const [y, m, d] = dateStr.split('-').map(Number);
      document.getElementById('modalDateTitle').textContent = `${y}년 ${m}월 ${d}일 일정 및 인원 지정`;

      const dayData = getDayDataForDate(dateStr);

      const modalShiftList = document.getElementById('modalShiftList');
      modalShiftList.innerHTML = '';

      ['A', 'B', 'C', 'D'].forEach(grp => {
        const memberStatuses = dayData.memberStatuses && dayData.memberStatuses[grp] ? dayData.memberStatuses[grp] : {};
        const members = GROUP_MEMBERS[grp];

        const row = document.createElement('div');
        row.className = 'bg-slate-50 dark:bg-slate-800/60 p-2.5 sm:p-3 rounded-2xl border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3';
        
        let membersHTML = '';
        members.forEach(name => {
          const currentNameStatus = memberStatuses[name] || 'NONE';
          membersHTML += `
            <div class="flex items-center gap-1 flex-1 w-full sm:w-auto">
              <span class="text-xs font-black text-slate-800 dark:text-slate-200 shrink-0 min-w-[28px]">${name}</span>
              <select id="member-status-${grp}-${name}" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg px-1.5 py-1 font-bold text-xs text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none flex-1">
                <option value="NONE" ${currentNameStatus === 'NONE' ? 'selected' : ''}>선택안함</option>
                <option value="연차" ${currentNameStatus === '연차' ? 'selected' : ''}>🌴 연차</option>
                <option value="휴가" ${currentNameStatus === '휴가' ? 'selected' : ''}>🏖️ 휴가</option>
                <option value="근속" ${currentNameStatus === '근속' ? 'selected' : ''}>🎁 근속</option>
                <option value="경사" ${currentNameStatus === '경사' ? 'selected' : ''}>🎉 경사</option>
                <option value="조사" ${currentNameStatus === '조사' ? 'selected' : ''}>🖤 조사</option>
                <option value="휴무" ${currentNameStatus === '휴무' ? 'selected' : ''}>💤 휴무</option>
                <option value="공가" ${currentNameStatus === '공가' ? 'selected' : ''}>🏛️ 공가</option>
                <option value="교육" ${currentNameStatus === '교육' ? 'selected' : ''}>✏️ 교육</option>
                <option value="부화합회의" ${currentNameStatus === '부화합회의' ? 'selected' : ''}>🤝 부화합회의</option>
                <option value="3S" ${currentNameStatus === '3S' ? 'selected' : ''}>✨ 3S</option>
                <option value="안전교육" ${currentNameStatus === '안전교육' ? 'selected' : ''}>🦺 안전교육</option>
              </select>
            </div>
          `;
        });

        row.innerHTML = `
          <div class="flex items-center gap-2 w-full sm:w-auto justify-start">
            <span class="font-black text-slate-800 dark:text-white text-xs sm:text-sm px-2 py-0.5 sm:px-2.5 sm:py-1 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 min-w-[45px] text-center">${grp}반</span>
          </div>
          <div class="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto flex-1 justify-end">
            ${membersHTML}
          </div>
        `;
        modalShiftList.appendChild(row);
      });

      document.getElementById('modalGeneralMemoInput').value = dayData.generalMemo || '';

      const modalMemoInputs = document.getElementById('modalMemoInputs');
      modalMemoInputs.innerHTML = '';

      ['A', 'B', 'C', 'D'].forEach(grp => {
        const memoVal = (dayData.memos && dayData.memos[grp]) ? dayData.memos[grp] : '';

        const memoBox = document.createElement('div');
        memoBox.className = 'flex items-center gap-2';
        memoBox.innerHTML = `
          <span class="w-12 sm:w-14 text-xs font-black text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 py-1.5 sm:py-2 rounded-xl text-center shrink-0">${grp}반</span>
          <input type="text" id="memo-input-${grp}" value="${memoVal}" placeholder="메모 입력..." 
            class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:bg-white dark:focus:bg-slate-900 focus:border-blue-500 rounded-xl px-3 py-1.5 sm:py-2 text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-100 outline-none transition">
        `;
        modalMemoInputs.appendChild(memoBox);
      });

      document.getElementById('dayModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('dayModal').classList.add('hidden');
      activeModalDateStr = null;
    }

    async function saveModalData() {
      if (!activeModalDateStr) return;

      if (!sharedDatabase[activeModalDateStr]) {
        sharedDatabase[activeModalDateStr] = { memberStatuses: {}, shifts: {}, memos: {}, generalMemo: '' };
      }
      if (!sharedDatabase[activeModalDateStr].memberStatuses) {
        sharedDatabase[activeModalDateStr].memberStatuses = {};
      }
      if (!sharedDatabase[activeModalDateStr].memos) {
        sharedDatabase[activeModalDateStr].memos = {};
      }

      const generalMemoInp = document.getElementById('modalGeneralMemoInput').value;
      sharedDatabase[activeModalDateStr].generalMemo = generalMemoInp;

      ['A', 'B', 'C', 'D'].forEach(grp => {
        const memoInp = document.getElementById(`memo-input-${grp}`).value;
        sharedDatabase[activeModalDateStr].memos[grp] = memoInp;

        if (!sharedDatabase[activeModalDateStr].memberStatuses[grp]) {
          sharedDatabase[activeModalDateStr].memberStatuses[grp] = {};
        }

        GROUP_MEMBERS[grp].forEach(name => {
          const mStatus = document.getElementById(`member-status-${grp}-${name}`).value;
          if (mStatus !== 'NONE') {
            sharedDatabase[activeModalDateStr].memberStatuses[grp][name] = mStatus;
          } else {
            delete sharedDatabase[activeModalDateStr].memberStatuses[grp][name];
          }
        });
      });

      await saveCloudData(sharedDatabase);
      closeModal();
    }

    async function deleteDayData() {
      if (!activeModalDateStr) return;
      delete sharedDatabase[activeModalDateStr];
      await saveCloudData(sharedDatabase);
      closeModal();
    }

    document.getElementById('prevMonthBtn').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    };

    document.getElementById('nextMonthBtn').onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    };
  </script>
</body>
</html>
